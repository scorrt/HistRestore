[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "histrestore"
version = "0.1.0"
description = "Evidence-constrained restoration selection with vision-language priors for historical document images."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Xueju Li"},
  {name = "Wenlian Deng"}
]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "opencv-python",
  "scikit-image",
  "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]
